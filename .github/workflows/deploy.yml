name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Inlined into the bundle at build time (next build). This is a
          # Storyblok preview token that ships to the browser by design (the
          # client StoryblokProvider needs it), so it lives in the workflow.
          NEXT_PUBLIC_STORYBLOK_DELIVERY_API_TOKEN: ej5GqVZrLlLQ6MT1qtoOZwtt
          NEXT_PUBLIC_STORYBLOK_REGION: eu
